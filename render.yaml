# render.yaml
# Blueprint para desplegar Gogeta-Bot en Render.com

services:
  # Servicio principal del bot de WhatsApp
  - type: web
    name: gogeta-bot
    env: node
    plan: free # Especificar el plan gratuito
    buildCommand: "npm install"
    startCommand: "npm start"
    # Variables de entorno para asegurar la versión correcta de Node.js
    envVars:
      - key: NODE_VERSION
        value: 24.15.0 # Requisito mínimo de @distube/ytdl-core 5
      - key: SESSION_PATH
        value: /var/data/session
      - key: DATABASE_PATH
        value: /var/data/data
    # Discos persistentes para guardar la sesión y los datos
    disks:
      - name: gogeta-session
        mountPath: /var/data/session
      - name: gogeta-data
        mountPath: /var/data/data