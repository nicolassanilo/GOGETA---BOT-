version: '3.8'

services:
  gogeta-bot:
    build: .
    container_name: gogeta-bot
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./session:/app/session
      - ./media:/app/media
    environment:
      - NODE_ENV=production
      - SESSION_PATH=/app/session
      - DATABASE_PATH=/app/data
    env_file:
      - .env
